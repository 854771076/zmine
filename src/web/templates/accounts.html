<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>账号管理 - ZMINE 自动化系统</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css" rel="stylesheet">
</head>
<body class="bg-gray-100 min-h-screen">
    <nav class="bg-blue-600 text-white p-4 shadow-lg">
        <div class="container mx-auto flex justify-between items-center">
            <h1 class="text-2xl font-bold flex items-center">
                <i class="fa fa-cogs mr-2"></i> ZMINE 自动化系统
            </h1>
            <div class="flex space-x-4">
                <a href="/" class="hover:bg-blue-700 px-3 py-2 rounded transition">仪表盘</a>
                <a href="/accounts" class="bg-blue-700 px-3 py-2 rounded transition">账号管理</a>
                <a href="/tasks" class="hover:bg-blue-700 px-3 py-2 rounded transition">任务管理</a>
                <a href="/invite" class="hover:bg-blue-700 px-3 py-2 rounded transition">邀请矩阵</a>
                <a href="/settings" class="hover:bg-blue-700 px-3 py-2 rounded transition">系统设置</a>
            </div>
        </div>
    </nav>

    <main class="container mx-auto p-4 mt-6">
        <!-- 操作按钮 -->
        <div class="flex justify-between items-center mb-6">
            <h2 class="text-2xl font-bold">账号管理</h2>
            <div class="flex gap-2">
                <button onclick="openBatchModal()" class="bg-purple-600 text-white px-4 py-2 rounded hover:bg-purple-700 transition flex items-center">
                    <i class="fa fa-users mr-2"></i> 批量创建
                </button>
                <button onclick="openAddModal()" class="bg-blue-600 text-white px-4 py-2 rounded hover:bg-blue-700 transition flex items-center">
                    <i class="fa fa-plus mr-2"></i> 添加账号
                </button>
            </div>
        </div>

        <!-- 账号列表 -->
        <div class="bg-white rounded-lg shadow">
            <div class="p-4 overflow-x-auto">
                <table class="min-w-full">
                    <thead>
                        <tr class="bg-gray-50">
                            <th class="px-4 py-3 text-left text-sm font-medium text-gray-500 cursor-pointer hover:text-gray-700 select-none" onclick="sortBy('id')">ID <span id="sort-icon-id"></span></th>
                            <th class="px-4 py-3 text-left text-sm font-medium text-gray-500 cursor-pointer hover:text-gray-700 select-none" onclick="sortBy('username')">用户名 <span id="sort-icon-username"></span></th>
                            <th class="px-4 py-3 text-left text-sm font-medium text-gray-500">邀请码</th>
                            <th class="px-4 py-3 text-left text-sm font-medium text-gray-500">邀请人ID</th>
                            <th class="px-4 py-3 text-left text-sm font-medium text-gray-500 cursor-pointer hover:text-gray-700 select-none" onclick="sortBy('points')">当前积分 <span id="sort-icon-points"></span></th>
                            <th class="px-4 py-3 text-left text-sm font-medium text-gray-500 cursor-pointer hover:text-gray-700 select-none" onclick="sortBy('total_points')">累计积分 <span id="sort-icon-total_points"></span></th>
                            <th class="px-4 py-3 text-left text-sm font-medium text-gray-500 cursor-pointer hover:text-gray-700 select-none" onclick="sortBy('mining_status')">挖矿状态 <span id="sort-icon-mining_status"></span></th>
                            <th class="px-4 py-3 text-left text-sm font-medium text-gray-500 cursor-pointer hover:text-gray-700 select-none" onclick="sortBy('status')">状态 <span id="sort-icon-status"></span></th>
                            <th class="px-4 py-3 text-left text-sm font-medium text-gray-500 cursor-pointer hover:text-gray-700 select-none" onclick="sortBy('created_at')">创建时间 <span id="sort-icon-created_at"></span></th>
                            <th class="px-4 py-3 text-left text-sm font-medium text-gray-500">操作</th>
                        </tr>
                    </thead>
                    <tbody id="accounts-table">
                        <tr>
                            <td colspan="10" class="px-4 py-8 text-center text-gray-500">加载中...</td>
                        </tr>
                    </tbody>
                </table>
            </div>
            <!-- 分页 -->
            <div class="p-4 border-t flex items-center justify-between flex-wrap gap-2">
                <div class="text-sm text-gray-500">
                    共 <span id="page-total">0</span> 条 · 第 <span id="page-current">1</span> / <span id="page-pages">1</span> 页
                </div>
                <div class="flex items-center gap-2">
                    <select id="page-size" onchange="changePageSize()" class="px-2 py-1 border border-gray-300 rounded-md text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
                        <option value="20">20 条/页</option>
                        <option value="50">50 条/页</option>
                        <option value="100">100 条/页</option>
                    </select>
                    <button onclick="gotoPage(currentPage - 1)" id="btn-prev" class="px-3 py-1 border border-gray-300 rounded-md text-sm hover:bg-gray-50 disabled:opacity-40 disabled:cursor-not-allowed">上一页</button>
                    <button onclick="gotoPage(currentPage + 1)" id="btn-next" class="px-3 py-1 border border-gray-300 rounded-md text-sm hover:bg-gray-50 disabled:opacity-40 disabled:cursor-not-allowed">下一页</button>
                </div>
            </div>
        </div>
    </main>

    <!-- 添加账号模态框 -->
    <div id="add-modal" class="fixed inset-0 bg-black bg-opacity-50 hidden items-center justify-center z-50">
        <div class="bg-white rounded-lg p-6 w-full max-w-md">
            <div class="flex justify-between items-center mb-4">
                <h3 class="text-xl font-bold">添加新账号</h3>
                <button onclick="closeAddModal()" class="text-gray-500 hover:text-gray-700">
                    <i class="fa fa-times text-xl"></i>
                </button>
            </div>
            <form id="add-form" onsubmit="addAccount(event)">
                <div class="mb-4">
                    <label class="block text-sm font-medium text-gray-700 mb-1">用户名</label>
                    <input type="text" id="username" required class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500" placeholder="请输入用户名">
                </div>
                <div class="mb-4">
                    <label class="block text-sm font-medium text-gray-700 mb-1">邀请码（可选）</label>
                    <input type="text" id="referral_code" class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500" placeholder="请输入邀请码">
                </div>
                <div class="mb-4">
                    <label class="block text-sm font-medium text-gray-700 mb-1">邀请人ID（可选）</label>
                    <input type="number" id="inviter_id" class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500" placeholder="请输入邀请人ID">
                </div>
                <div class="flex justify-end space-x-3">
                    <button type="button" onclick="closeAddModal()" class="px-4 py-2 border border-gray-300 rounded-md hover:bg-gray-50 transition">取消</button>
                    <button type="submit" class="px-4 py-2 bg-blue-600 text-white rounded-md hover:bg-blue-700 transition">添加</button>
                </div>
            </form>
        </div>
    </div>

    <!-- 账号详情模态框 -->
    <div id="detail-modal" class="fixed inset-0 bg-black bg-opacity-50 hidden items-center justify-center z-50">
        <div class="bg-white rounded-lg w-full max-w-2xl max-h-[85vh] overflow-y-auto">
            <div class="flex justify-between items-center p-6 pb-4 sticky top-0 bg-white border-b">
                <h3 class="text-xl font-bold">账号详情 <span id="detail-title" class="text-gray-400 font-normal"></span></h3>
                <button onclick="closeDetailModal()" class="text-gray-500 hover:text-gray-700">
                    <i class="fa fa-times text-xl"></i>
                </button>
            </div>
            <div class="p-6 pt-4">
                <div id="detail-info" class="grid grid-cols-2 gap-x-6 gap-y-3 text-sm mb-6">加载中...</div>
                <h4 class="font-bold mb-3">最近任务</h4>
                <div class="bg-gray-50 rounded-lg overflow-x-auto">
                    <table class="min-w-full text-sm">
                        <thead>
                            <tr class="bg-gray-100 text-gray-500">
                                <th class="px-3 py-2 text-left font-medium">ID</th>
                                <th class="px-3 py-2 text-left font-medium">名称</th>
                                <th class="px-3 py-2 text-left font-medium">类型</th>
                                <th class="px-3 py-2 text-left font-medium">状态</th>
                                <th class="px-3 py-2 text-left font-medium">时间</th>
                            </tr>
                        </thead>
                        <tbody id="detail-tasks">
                            <tr><td colspan="5" class="px-3 py-4 text-center text-gray-400">加载中...</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <!-- 批量创建账号模态框 -->
    <div id="batch-modal" class="fixed inset-0 bg-black bg-opacity-50 hidden items-center justify-center z-50">
        <div class="bg-white rounded-lg p-6 w-full max-w-md">
            <div class="flex justify-between items-center mb-4">
                <h3 class="text-xl font-bold">批量创建账号</h3>
                <button onclick="closeBatchModal()" class="text-gray-500 hover:text-gray-700">
                    <i class="fa fa-times text-xl"></i>
                </button>
            </div>
            <form id="batch-form" onsubmit="batchCreateAccounts(event)">
                <div class="mb-4">
                    <label class="block text-sm font-medium text-gray-700 mb-1">创建数量（1-100）</label>
                    <input type="number" id="batch_count" min="1" max="100" value="5" required class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-purple-500">
                    <p class="text-xs text-gray-400 mt-1">用户名自动随机生成（如 ivory_ridge96）</p>
                </div>
                <div class="mb-4">
                    <label class="block text-sm font-medium text-gray-700 mb-1">邀请人ID（可选）</label>
                    <input type="number" id="batch_inviter_id" class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-purple-500" placeholder="留空则随机使用现有账号的邀请码">
                </div>
                <div class="mb-4">
                    <label class="flex items-center gap-2 text-sm text-gray-700">
                        <input type="checkbox" id="batch_auto_register" checked class="w-4 h-4 rounded focus:ring-purple-500">
                        创建后自动提交站点注册任务（异步执行）
                    </label>
                </div>
                <div class="flex justify-end space-x-3">
                    <button type="button" onclick="closeBatchModal()" class="px-4 py-2 border border-gray-300 rounded-md hover:bg-gray-50 transition">取消</button>
                    <button type="submit" id="batch-submit" class="px-4 py-2 bg-purple-600 text-white rounded-md hover:bg-purple-700 transition">创建</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        // 列表状态
        let currentPage = 1;
        let pageSize = 20;
        let totalCount = 0;
        let currentSortBy = 'id';
        let currentSortOrder = 'desc';

        // 任务类型/状态映射（与 worker 枚举一致）
        const typeMap = {1: '注册', 2: '登录', 4: '挖矿', 5: '领取收益', 6: '同步资料', 7: 'Mind答题'};
        const taskStatusMap = {0: '等待中', 1: '运行中', 2: '成功', 3: '失败', 4: '已取消'};
        const taskStatusClass = {
            0: 'bg-yellow-100 text-yellow-800', 1: 'bg-blue-100 text-blue-800',
            2: 'bg-green-100 text-green-800', 3: 'bg-red-100 text-red-800',
            4: 'bg-gray-100 text-gray-800'
        };

        // 加载账号列表
        async function loadAccounts() {
            try {
                const params = new URLSearchParams({
                    page: currentPage,
                    page_size: pageSize,
                    sort_by: currentSortBy,
                    sort_order: currentSortOrder
                });
                const response = await fetch(`/api/accounts?${params}`);
                const data = await response.json();
                const tbody = document.getElementById('accounts-table');
                tbody.innerHTML = '';

                totalCount = data.total;
                const totalPages = Math.max(1, Math.ceil(totalCount / pageSize));
                if (currentPage > totalPages) { currentPage = totalPages; }
                document.getElementById('page-total').textContent = totalCount;
                document.getElementById('page-current').textContent = currentPage;
                document.getElementById('page-pages').textContent = totalPages;
                document.getElementById('btn-prev').disabled = currentPage <= 1;
                document.getElementById('btn-next').disabled = currentPage >= totalPages;

                if (data.accounts.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="10" class="px-4 py-8 text-center text-gray-500">暂无账号</td></tr>';
                    return;
                }

                data.accounts.forEach(account => {
                    const row = document.createElement('tr');
                    row.className = 'border-t hover:bg-gray-50';

                    let statusClass = '';
                    let statusText = '';
                    switch (account.status) {
                        case 0: statusClass = 'bg-red-100 text-red-800 px-2 py-1 rounded text-xs'; statusText = '禁用'; break;
                        case 1: statusClass = 'bg-green-100 text-green-800 px-2 py-1 rounded text-xs'; statusText = '正常'; break;
                        case 2: statusClass = 'bg-yellow-100 text-yellow-800 px-2 py-1 rounded text-xs'; statusText = '异常'; break;
                    }

                    let miningClass = '';
                    let miningText = '';
                    switch (account.mining_status) {
                        case 0: miningClass = 'bg-gray-100 text-gray-800 px-2 py-1 rounded text-xs'; miningText = '未开始'; break;
                        case 1: miningClass = 'bg-blue-100 text-blue-800 px-2 py-1 rounded text-xs'; miningText = '挖矿中'; break;
                        case 2: miningClass = 'bg-green-100 text-green-800 px-2 py-1 rounded text-xs'; miningText = '可领取'; break;
                    }

                    row.innerHTML = `
                        <td class="px-4 py-3">${account.id}</td>
                        <td class="px-4 py-3">${account.username}</td>
                        <td class="px-4 py-3 font-mono text-sm">${account.invite_code || '-'}</td>
                        <td class="px-4 py-3">${account.inviter_id || '-'}</td>
                        <td class="px-4 py-3 font-semibold">${account.points.toFixed(2)}</td>
                        <td class="px-4 py-3 font-semibold">${account.total_points.toFixed(2)}</td>
                        <td class="px-4 py-3"><span class="${miningClass}">${miningText}</span></td>
                        <td class="px-4 py-3"><span class="${statusClass}">${statusText}</span></td>
                        <td class="px-4 py-3 text-sm text-gray-500">${new Date(account.created_at).toLocaleString('zh-CN')}</td>
                        <td class="px-4 py-3">
                            <div class="flex space-x-2">
                                <button onclick="openDetailModal(${account.id})" class="text-indigo-600 hover:text-indigo-800" title="详情">
                                    <i class="fa fa-eye"></i>
                                </button>
                                <button onclick="loginAccount(${account.id})" class="text-blue-600 hover:text-blue-800" title="登录">
                                    <i class="fa fa-sign-in"></i>
                                </button>
                                <button onclick="deleteAccount(${account.id})" class="text-red-600 hover:text-red-800" title="删除">
                                    <i class="fa fa-trash"></i>
                                </button>
                            </div>
                        </td>
                    `;
                    tbody.appendChild(row);
                });
            } catch (error) {
                console.error('加载账号列表失败:', error);
                document.getElementById('accounts-table').innerHTML = '<tr><td colspan="10" class="px-4 py-8 text-center text-red-500">加载失败</td></tr>';
            }
        }

        // 分页控制
        function gotoPage(page) {
            const totalPages = Math.max(1, Math.ceil(totalCount / pageSize));
            if (page < 1 || page > totalPages) return;
            currentPage = page;
            loadAccounts();
        }

        function changePageSize() {
            pageSize = parseInt(document.getElementById('page-size').value);
            currentPage = 1;
            loadAccounts();
        }

        // 排序控制：同列点击切换升降序，不同列默认降序
        function sortBy(column) {
            if (currentSortBy === column) {
                currentSortOrder = currentSortOrder === 'desc' ? 'asc' : 'desc';
            } else {
                currentSortBy = column;
                currentSortOrder = 'desc';
            }
            updateSortIcons();
            currentPage = 1;
            loadAccounts();
        }

        function updateSortIcons() {
            ['id', 'username', 'points', 'total_points', 'mining_status', 'status', 'created_at'].forEach(col => {
                const el = document.getElementById(`sort-icon-${col}`);
                if (!el) return;
                el.textContent = col === currentSortBy ? (currentSortOrder === 'desc' ? '▼' : '▲') : '';
            });
        }

        // 账号详情
        async function openDetailModal(accountId) {
            const modal = document.getElementById('detail-modal');
            modal.classList.remove('hidden');
            modal.classList.add('flex');
            document.getElementById('detail-title').textContent = `#${accountId}`;
            document.getElementById('detail-info').innerHTML = '<div class="col-span-2 text-center text-gray-400 py-4">加载中...</div>';
            document.getElementById('detail-tasks').innerHTML = '<tr><td colspan="5" class="px-3 py-4 text-center text-gray-400">加载中...</td></tr>';

            try {
                const [accRes, taskRes] = await Promise.all([
                    fetch(`/api/accounts/${accountId}`),
                    fetch(`/api/tasks?account_id=${accountId}&page_size=10`)
                ]);
                const acc = await accRes.json();
                if (!accRes.ok) throw new Error(acc.detail || '加载失败');

                const miningMap = {0: '未开始', 1: '挖矿中', 2: '可领取'};
                const statusMap = {0: '禁用', 1: '正常', 2: '异常'};
                const fields = [
                    ['ID', acc.id],
                    ['用户名', acc.username],
                    ['邀请码', `<span class="font-mono">${acc.invite_code || '-'}</span>`],
                    ['邀请人ID', acc.inviter_id || '-'],
                    ['当前积分', acc.points.toFixed(2)],
                    ['累计积分', acc.total_points.toFixed(2)],
                    ['挖矿状态', miningMap[acc.mining_status] ?? acc.mining_status],
                    ['账号状态', statusMap[acc.status] ?? acc.status],
                    ['最近领取', acc.last_mining_claim ? new Date(acc.last_mining_claim).toLocaleString('zh-CN') : '-'],
                    ['站点会话', acc.has_session
                        ? '<span class="text-green-600 font-medium">有效（有 cookie）</span>'
                        : '<span class="text-gray-400">无（未注册/未登录）</span>'],
                    ['创建时间', new Date(acc.created_at).toLocaleString('zh-CN')],
                    ['更新时间', new Date(acc.updated_at).toLocaleString('zh-CN')]
                ];
                document.getElementById('detail-title').textContent = `#${acc.id} ${acc.username}`;
                document.getElementById('detail-info').innerHTML = fields.map(([k, v]) => `
                    <div class="flex"><span class="text-gray-400 w-24 shrink-0">${k}</span><span class="font-medium break-all">${v}</span></div>
                `).join('');

                const taskData = await taskRes.json();
                const tbody = document.getElementById('detail-tasks');
                if (!taskData.tasks || taskData.tasks.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="5" class="px-3 py-4 text-center text-gray-400">暂无任务</td></tr>';
                } else {
                    tbody.innerHTML = taskData.tasks.map(t => `
                        <tr class="border-t border-gray-100">
                            <td class="px-3 py-2">${t.id}</td>
                            <td class="px-3 py-2">${t.task_name || '-'}</td>
                            <td class="px-3 py-2">${typeMap[t.task_type] ?? t.task_type}</td>
                            <td class="px-3 py-2"><span class="px-2 py-0.5 rounded text-xs ${taskStatusClass[t.status] ?? ''}">${taskStatusMap[t.status] ?? t.status}</span></td>
                            <td class="px-3 py-2 text-gray-500">${new Date(t.created_at).toLocaleString('zh-CN')}</td>
                        </tr>
                    `).join('');
                }
            } catch (error) {
                console.error('加载账号详情失败:', error);
                document.getElementById('detail-info').innerHTML = `<div class="col-span-2 text-center text-red-500 py-4">加载失败: ${error.message}</div>`;
            }
        }

        function closeDetailModal() {
            const modal = document.getElementById('detail-modal');
            modal.classList.add('hidden');
            modal.classList.remove('flex');
        }

        // 打开添加模态框
        function openAddModal() {
            document.getElementById('add-modal').classList.remove('hidden');
            document.getElementById('add-modal').classList.add('flex');
        }

        // 关闭添加模态框
        function closeAddModal() {
            document.getElementById('add-modal').classList.add('hidden');
            document.getElementById('add-modal').classList.remove('flex');
        }

        // 批量创建
        function openBatchModal() {
            document.getElementById('batch-modal').classList.remove('hidden');
            document.getElementById('batch-modal').classList.add('flex');
        }

        function closeBatchModal() {
            document.getElementById('batch-modal').classList.add('hidden');
            document.getElementById('batch-modal').classList.remove('flex');
            document.getElementById('batch-form').reset();
            document.getElementById('batch_auto_register').checked = true;
        }

        async function batchCreateAccounts(event) {
            event.preventDefault();
            const count = parseInt(document.getElementById('batch_count').value);
            const inviterId = document.getElementById('batch_inviter_id').value;
            const autoRegister = document.getElementById('batch_auto_register').checked;
            const btn = document.getElementById('batch-submit');
            btn.disabled = true;
            btn.textContent = '创建中...';
            try {
                const response = await fetch('/api/accounts/batch', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({
                        count,
                        inviter_id: inviterId ? parseInt(inviterId) : null,
                        auto_register: autoRegister
                    })
                });
                const data = await response.json();
                if (!response.ok) throw new Error(data.detail || '创建失败');
                alert(`成功创建 ${count} 个账号${autoRegister ? '，注册任务已提交异步执行' : ''}\n` +
                      data.accounts.map(a => `#${a.id} ${a.username}`).join('\n'));
                closeBatchModal();
                loadAccounts();
            } catch (error) {
                alert('批量创建失败: ' + error.message);
            } finally {
                btn.disabled = false;
                btn.textContent = '创建';
            }
        }

        // 添加账号
        async function addAccount(event) {
            event.preventDefault();

            const username = document.getElementById('username').value;
            const referral_code = document.getElementById('referral_code').value;
            const inviter_id = document.getElementById('inviter_id').value;

            try {
                const payload = {
                    username: username,
                    password: '', // 密码字段留空，注册后使用loginKey作为密码
                    email: ''
                };

                if (referral_code) {
                    payload.invite_code = referral_code;
                }
                if (inviter_id) {
                    payload.inviter_id = parseInt(inviter_id);
                }

                const response = await fetch('/api/accounts', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(payload)
                });

                if (response.ok) {
                    alert('账号添加成功！');
                    closeAddModal();
                    loadAccounts();
                } else {
                    const error = await response.json();
                    alert(`添加失败: ${error.detail || '未知错误'}`);
                }
            } catch (error) {
                console.error('添加账号失败:', error);
                alert('添加失败，请稍后重试');
            }
        }

        // 登录账号
        async function loginAccount(accountId) {
            if (!confirm('确定要触发该账号的登录任务吗？')) {
                return;
            }

            try {
                const response = await fetch(`/api/accounts/${accountId}/login`, {
                    method: 'POST'
                });

                if (response.ok) {
                    alert('登录任务已创建！');
                } else {
                    const error = await response.json();
                    alert(`创建登录任务失败: ${error.detail || '未知错误'}`);
                }
            } catch (error) {
                console.error('登录账号失败:', error);
                alert('操作失败，请稍后重试');
            }
        }

        // 删除账号
        async function deleteAccount(accountId) {
            if (!confirm('确定要删除该账号吗？此操作不可恢复！')) {
                return;
            }

            try {
                const response = await fetch(`/api/accounts/${accountId}`, {
                    method: 'DELETE'
                });

                if (response.ok) {
                    alert('账号删除成功！');
                    loadAccounts();
                } else {
                    const error = await response.json();
                    alert(`删除失败: ${error.detail || '未知错误'}`);
                }
            } catch (error) {
                console.error('删除账号失败:', error);
                alert('删除失败，请稍后重试');
            }
        }

        // 页面加载完成后执行
        document.addEventListener('DOMContentLoaded', () => {
            loadAccounts();
        });
    </script>
</body>
</html>
